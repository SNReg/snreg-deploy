# SNReg server + Postgres (spec §8). Usage: cp .env.example .env && docker compose up -d
services:
  server:
    image: ghcr.io/snreg/snreg-server:${SNREG_VERSION:-0.1.0}
    # Host networking + NET_ADMIN: the server manages the kernel WireGuard interface snreg0.
    network_mode: host
    cap_add: [NET_ADMIN]
    # Userspace WireGuard fallback when the host kernel has none.
    devices: ["/dev/net/tun"]
    # master.key, tls.crt, tls.key. First run: docker compose run --rm server init
    volumes: ["./snreg:/etc/snreg"]
    environment:
      SNREG_LISTEN: 0.0.0.0:8443
      SNREG_PUBLIC_URL: ${SNREG_PUBLIC_URL:?set SNREG_PUBLIC_URL in .env, e.g. https://snreg.example.org:8443}
      SNREG_DATABASE_URL: postgres://snreg:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/snreg
      SNREG_TLS_CERT: /etc/snreg/tls.crt
      SNREG_TLS_KEY: /etc/snreg/tls.key
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: snreg
      POSTGRES_DB: snreg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "snreg"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db:
